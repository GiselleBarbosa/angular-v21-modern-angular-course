<mat-toolbar class="main-header">
  <button matButton>
    <mat-icon aria-hidden="false" aria-label="Home button" fontIcon="store"></mat-icon>
  </button>

  <span class="branding">Angular Moderno</span>

  <span class="spacer"></span>

  <button matButton>Produtos</button>

  <button matButton>
    <mat-icon
      [matBadge]="carrinhoService.totalProdutos()"
      [matBadgeHidden]="carrinhoService.totalProdutos() === 0"
      [matBadgeDescription]="'Itens adicionados ao carrinho'"
      aria-hidden="false"
      aria-label="Cart"
      fontIcon="shopping_cart"
    ></mat-icon>
  </button>
</mat-toolbar>
