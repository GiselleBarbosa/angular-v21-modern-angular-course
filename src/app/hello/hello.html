<p>Hello Angular v21!</p>

<h1>{{ title }}</h1>

<div class="container">
  <div class="container__signals">
    <div><button (click)="toggleState()">Alterar</button></div>
    <div>
      <button [disabled]="isDisabled">
        {{ btnLabel }}
      </button>
    </div>
  </div>

  <div class="container__signals__actions">
    <div>
      <h2>Signals</h2>
      <p><span>Valor atual</span>: {{ count() }}</p>
    </div>

    <div class="container__signals__action__buttons">
      <div><button (click)="decrease()">-</button></div>
      <div>
        {{ count() }}
      </div>
      <div>
        <button (click)="increase()">+</button>
      </div>

      <div>
        <button (click)="reset()">Reset</button>
      </div>
    </div>
    <div class="container__signals__action__buttons">
      <p><span>Double count:</span> {{ doubleCount() }}</p>
<!--       <p><span>Double count:</span> {{ getDoubleCount() }}</p>
 -->    </div>
  </div>
</div>
