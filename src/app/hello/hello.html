<p>Hello Angular v21!</p>

<h1>{{ title }}</h1>

<div class="container">
  <div class="container__signals__action__buttons">
    <div><button (click)="toggleState()">Alterar</button></div>
    <div>
      <button [disabled]="isDisabled">
        {{ btnLabel }}
      </button>
    </div>
  </div>

  <div class="container__signals">
    <div>
      <h2>Signals</h2>
      <p><span>Valor atual</span>: {{ counterSignal() }}</p>
    </div>

    <div>
      <button (click)="decrease()">-</button>
      {{ counterSignal() }}
      <button (click)="increase()">+</button>
    </div>
  </div>
</div>
