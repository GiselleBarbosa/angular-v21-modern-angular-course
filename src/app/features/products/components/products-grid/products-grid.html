<div class="products-container">
  <p>Total de produtos: {{ produtos().length }}</p>

  <mat-form-field appearance="outline" class="example-form-field">
    <mat-label>Buscar produtos</mat-label>
    <input matInput [(ngModel)]="termoPesquisa" placeholder="ex: Wireless Mouse" type="text" />
  </mat-form-field>

  <p class="search-preview">Item de busca: {{ termoPesquisa() }}</p>

  <div class="products-grid">
    @for (produto of produtosFiltrados(); track produto.id) {
      <app-product-card
        [produto]="produto"
        [addButtonLabel]="'Adicionar ao carrinho'"
        (addButtonCartClicked)="adicionarProdutoAoCarrinho(produto)"
      />
    } @empty {
      <div class="empty-state">
        <mat-icon>inventory_2</mat-icon>
        <p>Nenhum produto corresponde a sua pesquisa.</p>
      </div>
    }
  </div>
</div>
