<mat-card class="product-card">
  <mat-card-header>
    <mat-card-title>{{ produto().name }}</mat-card-title>
    <mat-card-subtitle>Category</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p>{{ produto().description }}</p>
    <p class="price">{{ produto().price }}</p>
  </mat-card-content>

  <mat-card-actions>
    <button matButton (click)="clickAddCartButton()">{{ addButtonLabel() }}</button>
  </mat-card-actions>
</mat-card>
